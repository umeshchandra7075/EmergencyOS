services:
  # MongoDB Database
  db:
    image: mongo:7.0
    container_name: emergency_routes_db
    restart: unless-stopped
    environment:
      - MONGO_INIT_DB=emergency_route_planner
    volumes:
      - mongodb_data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand({ping:1})"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Application Server
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: emergency_routes_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - MONGODB_URI=mongodb://db:27017/emergency_route_planner
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN}
      - JWT_REFRESH_EXPIRES_IN=${JWT_REFRESH_EXPIRES_IN}
      - CORS_ORIGIN=${CORS_ORIGIN}
      - NODE_ENV=${NODE_ENV}
      - PORT=${PORT}
    ports:
      - "4000:4000"
    volumes:
      - .:/app

  # Frontend (React + Vite)
  frontend:
    image: node:20-alpine
    container_name: emergency_routes_frontend
    restart: unless-stopped
    working_dir: /app
    command: >
      sh -c "
      npm install &&
      npm run dev -- --host
      "
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:4000
    depends_on:
      api:
        condition: service_healthy

volumes:
  mongodb_data: