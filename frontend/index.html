<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚨</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EmergencyOS — Real-Time Emergency Route Intelligence</title>
    <script>
      (function() {
        try {
          var t = localStorage.getItem('emergencyos_theme');
          var d = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (t === 'dark' || (!t && d) || (t === 'system' && d)) {
            document.documentElement.classList.add('dark');
          } else if (t === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 min-h-screen antialiased transition-colors duration-150">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
